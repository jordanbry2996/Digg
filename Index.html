<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">

  <meta name="theme-color" content="#15110d">

  <link rel="manifest" href="manifest.json">

  <title>Motherload</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #15110d;
      color: #fff0cf;
      font-family: Arial, sans-serif;
      touch-action: none;
    }

    #game {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
    }

    #topbar {
      height: 60px;
      flex-shrink: 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 6px 12px;
      background: #241b13;
      border-bottom: 2px solid #5d4328;
    }

    .stat {
      font-size: 12px;
      text-align: center;
    }

    .stat strong {
      display: block;
      font-size: 17px;
    }

    #title {
      font-size: 18px;
      font-weight: bold;
      letter-spacing: 2px;
    }

    #gameArea {
      position: relative;
      flex: 1;
      min-height: 0;
    }

    canvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    #hud {
      position: absolute;
      top: 10px;
      left: 10px;
      padding: 8px 10px;
      background: rgba(30, 22, 15, .88);
      border: 1px solid #76542f;
      border-radius: 8px;
      font-size: 12px;
      line-height: 1.5;
    }

    #controls {
      height: 150px;
      flex-shrink: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 20px;
      background: #241b13;
      border-top: 2px solid #5d4328;
    }

    #dpad {
      display: grid;
      grid-template-columns: 62px 62px 62px;
      grid-template-rows: 50px 50px;
      gap: 6px;
    }

    button {
      border: 1px solid #79572f;
      border-radius: 9px;
      background: #3a2b1d;
      color: #ffe4ae;
      font-weight: bold;
      user-select: none;
      -webkit-user-select: none;
    }

    button:active {
      transform: scale(.95);
      background: #594127;
    }

    .direction {
      font-size: 22px;
    }

    .blank {
      visibility: hidden;
    }

    #actions {
      display: flex;
      flex-direction: column;
      gap: 7px;
    }

    #actions button {
      width: 100px;
      height: 48px;
      font-size: 11px;
    }

    #shop {
      position: absolute;
      inset: 0;
      display: none;
      justify-content: center;
      align-items: center;
      padding: 20px;
      background: rgba(0,0,0,.75);
    }

    #shopBox {
      width: min(360px, 100%);
      background: #281d14;
      border: 2px solid #8b6336;
      border-radius: 14px;
      padding: 18px;
    }

    #shopBox h2 {
      margin-top: 0;
    }

    .upgrade {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px;
      margin: 8px 0;
      background: #39291c;
      border-radius: 8px;
    }

    .upgrade button {
      padding: 9px;
    }

    #closeShop {
      width: 100%;
      padding: 12px;
      margin-top: 8px;
    }
  </style>
</head>

<body>

<div id="game">

  <div id="topbar">

    <div class="stat">
      💰
      <strong id="money">$0</strong>
      Cash
    </div>

    <div id="title">
      MOTHERLOAD
    </div>

    <div class="stat">
      ⛽
      <strong id="fuel">100%</strong>
      Fuel
    </div>

  </div>

  <div id="gameArea">

    <canvas id="canvas"></canvas>

    <div id="hud">
      Depth: <b><span id="depth">0</span>m</b><br>
      Ore: <b><span id="ore">0</span></b> /
      <b><span id="capacity">50</span> kg</b>
    </div>

    <div id="shop">

      <div id="shopBox">

        <h2>🛠️ Upgrade Shop</h2>

        <div class="upgrade">
          <span>
            Fuel Tank<br>
            <small>Increase fuel capacity</small>
          </span>
          <button id="fuelUpgrade">
            $100
          </button>
        </div>

        <div class="upgrade">
          <span>
            Drill<br>
            <small>Mine faster</small>
          </span>
          <button id="drillUpgrade">
            $125
          </button>
        </div>

        <div class="upgrade">
          <span>
            Storage<br>
            <small>Carry more ore</small>
          </span>
          <button id="storageUpgrade">
            $150
          </button>
        </div>

        <button id="closeShop">
          RETURN TO MINE
        </button>

      </div>

    </div>

  </div>

  <div id="controls">

    <div id="dpad">

      <button class="blank"></button>

      <button class="direction"
              data-key="ArrowUp">
        ▲
      </button>

      <button class="blank"></button>

      <button class="direction"
              data-key="ArrowLeft">
        ◀
      </button>

      <button class="direction"
              data-key="ArrowDown">
        ▼
      </button>

      <button class="direction"
              data-key="ArrowRight">
        ▶
      </button>

    </div>

    <div id="actions">

      <button id="surface">
        🚀 SURFACE
      </button>

      <button id="openShop">
        🛠️ UPGRADES
      </button>

    </div>

  </div>

</div>

<script src="game.js"></script>

<script>
  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("sw.js");
  }
</script>

</body>
</html>
